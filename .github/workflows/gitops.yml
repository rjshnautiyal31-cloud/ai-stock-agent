name: "GitOps Infrastructure Pipeline"

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

# Required permissions for OIDC authentication via Workload Identity Federation
permissions:
  id-token: write
  contents: read

jobs:
  validate:
    name: "Validate Infrastructure"
    runs-on: "ubuntu-latest"

    steps:
      - name: "Checkout Code"
        uses: "actions/checkout@v4"

      - name: "Set up Terraform"
        uses: "hashicorp/setup-terraform@v3"
        with:
          terraform_version: "1.15.8"

      - name: "Terraform Format Check"
        run: "terraform fmt -check -recursive"

      - name: "Initialize App Workspace"
        run: "terraform init -backend=false"
        working-directory: "terraform/app"

      - name: "Validate App Workspace"
        run: "terraform validate"
        working-directory: "terraform/app"

  deploy:
    name: "Build & Deploy App Suite"
    needs: "validate"
    if: "github.ref == 'refs/heads/main' && github.event_name == 'push'"
    runs-on: "ubuntu-latest"

    steps:
      - name: "Checkout Code"
        uses: "actions/checkout@v4"

      # Authenticate to Google Cloud using Workload Identity Federation (WIF)
      - name: "Authenticate to Google Cloud"
        id: "auth"
        uses: "google-github-actions/auth@v2"
        with:
          workload_identity_provider: "projects/988401930376/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider"
          service_account: "github-actions-deployer@fabled-ruler-363118.iam.gserviceaccount.com"

      - name: "Set up Cloud SDK"
        uses: "google-github-actions/setup-gcloud@v2"

      # Configure Docker auth helper to securely push to Google Artifact Registry
      - name: "Configure Docker Credentials"
        run: "gcloud auth configure-docker us-central1-docker.pkg.dev --quiet"

      # Compile and push the unified custom Python container image (Tagging with Commit SHA)
      - name: "Build & Push Docker Image"
        run: |
          docker build -t us-central1-docker.pkg.dev/fabled-ruler-363118/alphavantage-agent-repo/agent-suite:${{ github.sha }} .
          docker push us-central1-docker.pkg.dev/fabled-ruler-363118/alphavantage-agent-repo/agent-suite:${{ github.sha }}

      - name: "Set up Terraform"
        uses: "hashicorp/setup-terraform@v3"
        with:
          terraform_version: "1.15.8"

      - name: "Initialize Terraform Backend"
        run: "terraform init"
        working-directory: "terraform/app"

      - name: "Terraform Apply"
        run: |
          terraform apply \
            -var="image_uri=us-central1-docker.pkg.dev/fabled-ruler-363118/alphavantage-agent-repo/agent-suite:${{ github.sha }}" \
            -var="github_repository=rjshnautiyal31-cloud/ai-stock-agent" \
            -auto-approve
        working-directory: "terraform/app"
